[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts = -v --tb=short --strict-markers --cov=ml_core --cov-report=term-missing:skip-covered --cov-fail-under=80
markers =
    unit: модульные тесты (одна функция)
    integration: интеграционные тесты (несколько модулей)
    slow: медленные тесты (>1 сек)
