services:
  # ==================== Общие ====================

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - ml-api
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==================== ML-модуль ====================

  ml-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=false
      - PYTHONPATH=/app
    volumes:
      - ml-models:/app/models
      - ml-logs:/app/logs
      - ml-experiments:/app/experiments
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ml-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      redis:
        condition: service_healthy
      ml-api:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    volumes:
      - ml-models:/app/models
      - ml-logs:/app/logs
      - ml-experiments:/app/experiments

# ==================== Volumes ====================
volumes:
  ml-models:        # Сохранённые модели (.pkl + .json)
  ml-logs:          # Логи, метрики, отчёты дрейфа
  ml-experiments:   # Сохранённые эксперименты
