services:
  # ==================== Общие ====================

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - ml-api
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==================== ML-модуль (Ray) ====================

  ray-head:
    image: rayproject/ray:2.9.0-py311
    user: root
    shm_size: "4g"
    ports:
      - "8265:8265"
      - "10001:10001"
    command: ray start --head --port=6379 --dashboard-host=0.0.0.0 --num-cpus=4 --disable-usage-stats --temp-dir=/tmp/ray --block
    environment:
      - RAY_TMPDIR=/tmp/ray
    volumes:
      - ray_data:/tmp/ray
    healthcheck:
      test: [ "CMD", "ray", "status" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      ray-head:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=false
      - PYTHONPATH=/app
    volumes:
      - ./:/app
      - ml-models:/app/models
      - ml-logs:/app/logs
      - ml-experiments:/app/experiments
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ray-worker:
    image: rayproject/ray:2.9.0-py311
    user: root
    shm_size: "4g"
    depends_on:
      ray-head:
        condition: service_healthy
    command: ray start --address=ray-head:6379 --num-cpus=4 --temp-dir=/tmp/ray --block
    volumes:
      - ./:/app
      - ray_data:/tmp/ray
    environment:
      - PYTHONPATH=/app
      - RAY_TMPDIR=/tmp/ray

# ==================== Volumes ====================
volumes:
  ml-models:        # Сохранённые модели (.pkl + .json)
  ml-logs:          # Логи, метрики, отчёты дрейфа
  ml-experiments:   # Сохранённые эксперименты
  ray_data:
